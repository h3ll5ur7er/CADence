# CAD-31, CAD-32, CAD-58: every push and pull request is checked (the desktop app on Windows too); master is then published on GitHub Pages.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Journeys against the dev build
        run: npm run e2e
      - name: Journeys against the Pages build (sub-path, offline)
        run: npm run e2e:pages
      - name: Keep the evidence and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: journeys
          path: |
            e2e/evidence/
            playwright-report/
            test-results/
          retention-days: 14

  desktop:
    name: Desktop smoke test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (-not (Test-Path $key)) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2.exe"
            Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList '/silent', '/install' -Wait
          }
      - run: npm ci
      - name: Build the desktop app (with WebView2 remote debugging, for the test)
        run: npx tauri build --no-bundle --config src-tauri/tauri.test.conf.json
      - name: Smoke test (WebView2 remote debugging, the native save dialog)
        run: npm run e2e:desktop
      - name: What the desktop showed, and what ran (on failure)
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save('test-results/desktop-screen.png')
          Get-Process | Where-Object { $_.ProcessName -match 'cadence|webview' } | Format-Table Id, ProcessName, SessionId, MainWindowTitle
          Get-ChildItem "$env:LOCALAPPDATA\dev.cadence.app" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 FullName
      - name: Keep the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            e2e/evidence/63-desktop.png
            test-results/
          retention-days: 14

  pages:
    name: Publish on GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, journeys]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          BASE_HREF: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cadence/browser
      - id: deploy
        uses: actions/deploy-pages@v4
