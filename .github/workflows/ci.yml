# CAD-31, CAD-32: every push and pull request is checked; master is then published on GitHub Pages.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Journeys against the dev build
        run: npm run e2e
      - name: Journeys against the Pages build (sub-path, offline)
        run: npm run e2e:pages
      - name: Keep the evidence and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: journeys
          path: |
            e2e/evidence/
            playwright-report/
            test-results/
          retention-days: 14

  pages:
    name: Publish on GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, journeys]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          BASE_HREF: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cadence/browser
      - id: deploy
        uses: actions/deploy-pages@v4
