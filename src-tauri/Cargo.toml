[package]
name = "cadence"
version = "0.47.0"
description = "CADence: parametric CAD for 3D printing and laser cutting"
authors = ["Emanuel Knecht"]
license = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
# Plugin settings in tauri.conf.json are embedded as JSON by `generate_context!`.
serde_json = "1"
# `watch`: the app follows changes other processes (agents) make in its project folders (CAD-150).
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "~2.6"
tauri-plugin-process = "~2.4"
tauri-plugin-updater = "~2.13"
