<div class="bar" role="toolbar" aria-label="Sketch tools">
  <div class="group" role="group" aria-label="Draw">
    @for (t of tools; track t.tool) {
      <button
        type="button"
        class="tool"
        [class.active]="store.tool() === t.tool"
        [attr.aria-pressed]="store.tool() === t.tool"
        [attr.aria-label]="t.label"
        [title]="t.key ? t.label + ' (' + t.key + ')' : t.label"
        (click)="store.tool.set(t.tool)"
      >
        <cad-icon [name]="t.icon" [size]="18" />
      </button>
    }
    @if (store.tool() === 'polygon') {
      <label class="sides" title="Sides of the polygon">
        <input type="number" min="3" max="64" aria-label="Polygon sides" [value]="store.polygonSides()" (change)="setSides($any($event.target).value)" />
        sides
      </label>
    }
  </div>

  <div class="group" role="group" aria-label="Constrain the selection">
    @for (c of constraintTools; track c.tool) {
      <button
        type="button"
        class="tool symbol"
        [disabled]="!applicable(c.tool)"
        [attr.aria-label]="c.label"
        [title]="c.label"
        (click)="constrain(c.tool)"
      >
        {{ c.symbol }}
      </button>
    }
  </div>

  <div class="group" role="group" aria-label="Edit the selection">
    <button type="button" class="tool" [disabled]="!canToggleConstruction()" aria-label="Construction geometry" title="Construction geometry (X)" (click)="toggleConstruction()">
      <cad-icon name="construction" [size]="18" />
    </button>
    <button type="button" class="tool" [disabled]="store.selection().length === 0" aria-label="Delete selection" title="Delete selection (Del)" (click)="remove()">
      <cad-icon name="trash" [size]="18" />
    </button>
  </div>

  <span class="status" [class.done]="view()?.status === 'fully-constrained'" data-testid="sketch-status">{{ status() }}</span>

  <div class="group end" role="group" aria-label="Sketch">
    @if (store.importedDrawings().length) {
      <div class="menu">
        <button type="button" class="btn" aria-haspopup="menu" [attr.aria-expanded]="insertOpen()" (click)="insertOpen.set(!insertOpen())">
          <cad-icon name="imported" /> Insert drawing
        </button>
        @if (insertOpen()) {
          <div class="menu-list" role="menu" aria-label="Imported drawings">
            @for (d of store.importedDrawings(); track d.id) {
              <button type="button" role="menuitem" (click)="insertOpen.set(false); store.insertDrawing(d.id)">{{ d.name }} ({{ d.format?.toUpperCase() }})</button>
            }
          </div>
        }
      </div>
    }
    <button type="button" class="btn" title="Export for laser cutting" (click)="export('dxf')">
      <cad-icon name="download" /> DXF
    </button>
    <button type="button" class="btn" title="Export as SVG" (click)="export('svg')">
      <cad-icon name="download" /> SVG
    </button>
    @if (kerf(); as kerf) {
      <button type="button" class="btn" [title]="'DXF with outlines offset for the ' + kerf + ' mm kerf'" (click)="export('dxf', true)">
        <cad-icon name="download" /> DXF −kerf
      </button>
    }
    <button type="button" class="btn btn-primary" (click)="store.finishEditing()">
      <cad-icon name="check" /> Finish sketch
    </button>
  </div>
</div>
<p class="hint">{{ hint() }}</p>
